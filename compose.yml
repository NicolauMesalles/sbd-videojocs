services:
  db:
    container_name: BBDD_Videojocs
    image: mysql:8.4
    restart: always
    env_file:
      - .env
    ports: 
      - "127.0.0.1:3306:3306"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - db_data:/var/lib/mysql

  app:
    container_name: filler
    image: python:3.12-slim
    #hem de decidir si utilitzem una imatge pelada
    #o la construim nosaltres desde app/ amb un Dockerfile
    #si es el segon utilitzariem un build
    env_file:
      - .env
    depends_on:
      - db

volumes:
  db_data: